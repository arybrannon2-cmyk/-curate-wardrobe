function rasterGarment(id){
 if(garmentPngCache[id])return garmentPngCache[id];
 const pal={t1:['#292a29','#51534f'],t2:['#f7f7f2','#d6d7d2'],t3:['#969b9f','#70767b'],b1:['#6080a8','#405f85'],b2:['#23272a','#444a4e'],b3:['#a4a9ac','#777f83'],s1:['#f4f4ef','#b8bdb9'],s2:['#24282b','#4a4f53'],s3:['#795842','#523a2b']};
 const c=document.createElement('canvas');c.width=480;c.height=430;const x=c.getContext('2d',{willReadFrequently:true});x.scale(2,2);
 const [fill,stroke]=pal[id]||['#93989a','#565c5f'];
 function path(d,color=fill,line=stroke,w=3){const p=new Path2D(d);x.fillStyle=color;x.strokeStyle=line;x.lineWidth=w;x.lineJoin='round';x.fill(p);x.stroke(p)}
 function lines(d,color=stroke,w=3){x.strokeStyle=color;x.lineWidth=w;x.lineJoin='round';x.lineCap='round';x.stroke(new Path2D(d))}
 x.fillStyle='rgba(75,75,75,.08)';x.beginPath();x.ellipse(120,200,54,5,0,0,Math.PI*2);x.fill();
 if(id[0]==='t'){
 path('M73 42 L98 27 L142 27 L167 42 L185 79 L165 88 L154 68 L154 178 Q120 184 86 178 L86 68 L75 88 L55 79 Z');
 lines('M101 28 Q120 48 139 28',stroke,5);lines('M86 176 H154',stroke,4);
 if(id==='t1'){x.globalAlpha=.23;lines('M91 57 V166 M99 55 V169 M107 52 V171 M133 52 V171 M141 55 V169 M149 57 V166','#8c8b88',1.7);x.globalAlpha=1}
 if(id==='t3'){x.globalAlpha=.3;lines('M90 62 H150 M88 83 H152 M88 104 H152 M88 125 H152 M88 146 H152','#d1d3d6',1.7);x.globalAlpha=1}
 }else if(id[0]==='b'){
 path('M78 24 H162 L168 78 L150 188 L126 188 L122 90 L118 90 L114 188 L90 188 L72 78 Z');
 lines('M78 42 H162 M119 42 V77 M77 59 L99 70 M163 59 L141 70',stroke,2.4);
 lines('M88 183 H113 M127 183 H151',stroke,id==='b3'?8:4);
 }else if(id==='s3'){
 path('M74 48 H126 L138 116 L173 132 Q186 141 183 164 H55 Q45 155 53 139 L72 126 Z');
 lines('M56 157 H181 M86 66 H120 M86 80 H123 M86 94 H126',stroke,4);
 }else{
 path('M44 126 Q58 116 72 102 L94 86 124 94 148 126 183 135 Q194 142 191 154 Q186 168 164 170 L68 170 Q40 167 39 149 Z');
 lines('M86 111 L124 129 M95 102 L132 120 M104 95 L139 111',stroke,3);
 lines('M41 153 Q102 171 190 152',stroke,7);
 }
 // Store as an actual PNG data URL generated by the browser canvas.
 return garmentPngCache[id]=c.toDataURL('image/png');
}
function img(item){
 if(demoById.has(item[0]))return '<img class="garment-image" src="'+rasterGarment(item[0])+'" alt="'+esc(demoById.get(item[0])[1])+'">';
 return item[4]?'<img src="'+esc(item[4])+'" alt="'+esc(item[1])+'">':sampleSvg(item);
}
function art(item){return '<div class="art">'+img(item)+'</div>'}
function outfit(o){return '<div class="flat">'+['tops','bottoms','shoes'].map(c=>art(one(o[c]))).join('')+'</div>'}
function studioFlat(o){return '<div class="editorial-board"><div class="editorial-head"><div><div class="editorial-kicker">CURATE <span class="editorial-star">✦</span> THE DAILY COLLECTION</div><div class="editorial-title">The complete look</div><div class="editorial-issue">PERSONAL WARDROBE / LOOK STUDY</div></div><span class="editorial-number">EDIT 001</span></div><div class="editorial-grid">'+['tops','bottoms','shoes'].map((c,i)=>'<div class="editorial-piece"><span class="editorial-index">0'+(i+1)+'</span>'+art(one(o[c]))+'<span class="editorial-caption">'+esc(one(o[c])[1])+'</span></div>').join('')+'</div><div class="editorial-note"><span class="editorial-note-mark">✦</span><div><span class="editorial-note-title">Collection note</span><p>Three considered pieces. One everyday look.</p></div></div><div class="editorial-foot"><span>Curated from your wardrobe</span><span>STUDIO · 01</span></div></div>'}

function cycle(cat,n){const arr=items.filter(x=>x[2]===cat);let ix=arr.findIndex(x=>x[0]===selected[cat]);if(arr.length){selected[cat]=arr[(ix+n+arr.length)%arr.length][0];save('selected',selected);render()}}
function shuffle(){['tops','bottoms','shoes'].forEach(c=>{let arr=items.filter(x=>x[2]===c);if(arr.length)selected[c]=arr[Math.floor(Math.random()*arr.length)][0]});save('selected',selected);render()}
function saveLook(){if(!looks.some(l=>l.tops===selected.tops&&l.bottoms===selected.bottoms&&l.shoes===selected.shoes)){looks.unshift({...selected,id:Date.now()});save('looks',looks);alert('Saved to My Looks ♡')}else alert('Already saved ♡');render()}
function markWorn(){worn.unshift({date:new Date().toLocaleDateString(),...selected});save('worn',worn);alert('Outfit recorded for today');render()}
function today(){return '<h2>Good morning.</h2><p class="sub">A considered wardrobe, without the effort. Sample outfits · Weather and AI arrive later.</p><section class="card"><div class="row"><h3>Today’s Look</h3><span class="sub">01 / CURATE</span></div>'+outfit(selected)+'<p class="sub">'+['tops','bottoms','shoes'].map(c=>esc(one(selected[c])[1])).join(' · ')+'</p><div class="buttons"><button class="btn primary" data-act="wear">Wore This Today</button><button class="btn" data-act="shuffle">Shuffle ↻</button><button class="btn" data-tab="Studio">Customize</button></div></section><section class="card"><h3>Make getting dressed easy.</h3><p class="sub">Build an outfit in Studio, then save it to My Looks. Your selections stay on this browser.</p></section>'}
function wardrobe(){let list=items.filter(i=>(filter==='all'||i[2]===filter)&&i[1].toLowerCase().includes(query.toLowerCase()));return '<h2>Wardrobe</h2><p class="sub">'+items.length+' pieces in your closet</p><input class="search" id="search" value="'+esc(query)+'" placeholder="Search your wardrobe…"><div class="buttons">'+['all','tops','bottoms','shoes'].map(c=>'<button class="pill '+(c===filter?'active':'')+'" data-filter="'+c+'">'+c[0].toUpperCase()+c.slice(1)+'</button>').join('')+'</div><section class="card"><h3>Quick Add</h3><p class="sub">Add a clothing photo. It stays in this browser only.</p><input id="photo" type="file" accept="image/*"><div class="buttons"><input id="garmentName" class="search" style="flex:1;min-width:130px" placeholder="Item name"><select id="garmentCat" class="btn"><option value="tops">Tops</option><option value="bottoms">Bottoms</option><option value="shoes">Shoes</option></select><button class="btn primary" data-act="add">Add</button></div></section><div class="grid">'+list.map(i=>'<div class="item">'+art(i)+'<b>'+esc(i[1])+'</b><small>'+esc(i[2])+'</small></div>').join('')+'</div>'}
function studio(){return '<div class="studio-compact"><h2>Smart Studio</h2><div class="studio-intro"><div class="studio-eyebrow">Your personal styling canvas</div><p>Build something worth wearing.</p><span class="sub">Swipe garments or tap arrows. Switch views anytime.</span></div><div class="studio-toggle"><button class="pill '+(!flat?'active':'')+'" data-view="interactive">Interactive</button><button class="pill '+(flat?'active':'')+'" data-view="flat">Flat Lay</button></div><section class="card">'+(flat?studioFlat(selected):['tops','bottoms','shoes'].map(c=>'<div class="slot"><button data-cycle="'+c+'" data-n="-1" aria-label="Previous '+c+'">‹</button><div class="piece" data-swipe="'+c+'">'+art(one(selected[c]))+'<strong>'+esc(one(selected[c])[1])+'</strong><span class="sub">'+c+'</span></div><button data-cycle="'+c+'" data-n="1" aria-label="Next '+c+'">›</button></div>').join(''))+'<div class="buttons"><button class="btn primary" data-act="save">♡ Save Look</button><button class="btn" data-act="shuffle">Surprise Me ↻</button></div></section><p class="sub">This first version uses demo pieces and simple matching. No image generation or AI required.</p></div>'}
function myLooks(){return '<h2>My Looks</h2><p class="sub">Your saved combinations and outfit history.</p>'+(looks.length?looks.map((l,i)=>'<section class="card"><div class="row"><h3>Look '+(looks.length-i)+'</h3><span class="sub">Saved</span></div>'+outfit(l)+'<p class="sub">'+['tops','bottoms','shoes'].map(c=>esc(one(l[c])[1])).join(' · ')+'</p><div class="buttons"><button class="btn primary" data-open="'+i+'">Edit in Studio</button><button class="btn" data-remove="'+i+'">Remove</button></div></section>').join(''):'<section class="card empty">No looks saved yet. Try saving one from Studio.</section>')+'<section class="card"><h3>Wear history</h3><p class="sub">'+worn.length+' outfit entries logged</p>'+worn.slice(0,5).map(l=>'<p class="sub">'+esc(l.date)+' · '+esc(one(l.tops)[1])+'</p>').join('')+'</section>'}

const diagnosticIds=['t2','b2','s2'];let diagnosticsVisible=false;
function diagnosticsShell(){const colors={t2:'#f7f7f2',b2:'#23272a',s2:'#24282b'};return '<section class="diag-panel" id="diagPanel" '+(diagnosticsVisible?'':'hidden')+'><div class="row"><h3>Color Diagnostics · Temporary</h3><button class="diag-action" data-act="diag-refresh">Refresh</button></div><p class="sub">Compare the actual image against a fixed CSS color swatch.</p><p class="sub" id="diagTheme"></p>'+diagnosticIds.map(id=>'<div class="diag-row"><strong>'+esc(demoById.get(id)[1])+'</strong><div class="diag-visuals"><img class="diag-image garment-image" data-diag-id="'+id+'" src="'+rasterGarment(id)+'" alt="'+esc(demoById.get(id)[1])+'"><div><div class="diag-swatch" style="background:'+colors[id]+'"></div><div class="sub">'+colors[id]+'</div></div></div><div class="diag-info" id="diag-'+id+'">Checking image…</div></div>').join('')+'</section>'}
function updateDiagnostics(){const panel=$('diagPanel');if(!panel||panel.hidden)return;const bodyStyle=getComputedStyle(document.body);$('diagTheme').textContent='Active theme: '+theme+' | body class: '+(document.body.className||'(none)')+' | color-scheme: '+bodyStyle.colorScheme;for(const id of diagnosticIds){const el=panel.querySelector('[data-diag-id="'+id+'"]');const st=getComputedStyle(el);const src=el.currentSrc||el.src;const kind=src.startsWith('data:image/png')?'Canvas-generated PNG':src.startsWith('data:image/svg')?'SVG data asset':src.startsWith('http')?'Static/network asset':'Other';const source=src.startsWith('data:')?src.substring(0,src.indexOf(',')+1):src;$('diag-'+id).textContent=['Image source: '+source,'Image type: '+kind,'Computed filter: '+st.filter,'Mix-blend-mode: '+st.mixBlendMode,'Opacity: '+st.opacity,'Loaded: '+el.complete+' | dimensions: '+el.naturalWidth+' x '+el.naturalHeight].join('\n');}}
function render(){const pages={Today:today,Wardrobe:wardrobe,Studio:studio,'My Looks':myLooks};$('main').innerHTML='<div class="buttons"><button class="diag-action" data-act="diag-toggle">'+(diagnosticsVisible?'Hide':'Show')+' Color Diagnostics</button></div>'+diagnosticsShell()+pages[tab]();if(diagnosticsVisible)requestAnimationFrame(updateDiagnostics);$('nav').innerHTML=['Today','Wardrobe','Studio','My Looks'].map((t,i)=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'"><span>'+['⌂','▦','✧','♡'][i]+'</span>'+t+'</button>').join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.act==='diag-toggle'){diagnosticsVisible=!diagnosticsVisible;render()}else if(d.act==='diag-refresh'){updateDiagnostics()}else if(d.tab){tab=d.tab;render()}else if(d.cycle)cycle(d.cycle,Number(d.n));else if(d.filter){filter=d.filter;render()}else if(d.view){flat=d.view==='flat';render()}else if(d.open!==undefined){selected={tops:looks[+d.open].tops,bottoms:looks[+d.open].bottoms,shoes:looks[+d.open].shoes};save('selected',selected);tab='Studio';render()}else if(d.remove!==undefined){looks.splice(+d.remove,1);save('looks',looks);render()}else if(d.act==='shuffle')shuffle();else if(d.act==='save')saveLook();else if(d.act==='wear')markWorn();else if(d.act==='add'){let f=$('photo').files[0],name=$('garmentName').value.trim(),cat=$('garmentCat').value;if(!name){alert('Enter a clothing name');return}if(!f){alert('Choose a photo');return}if(f.size>1500000){alert('Please use a photo smaller than 1.5 MB for this demo');return}let rd=new FileReader();rd.onload=()=>{items.push(['u'+Date.now(),name,cat,'👕',rd.result]);save('items',items);render()};rd.readAsDataURL(f)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let s=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(s,s)}});
let startX=null;document.addEventListener('touchstart',e=>{let el=e.target.closest('[data-swipe]');if(el)startX={x:e.touches[0].clientX,c:el.dataset.swipe}},{passive:true});document.addEventListener('touchend',e=>{if(!startX)return;let diff=e.changedTouches[0].clientX-startX.x;if(Math.abs(diff)>35)cycle(startX.c,diff<0?1:-1);startX=null},{passive:true});
$('themeButton').addEventListener('click',()=>{theme=theme==='pearl'?'warm':theme==='warm'?'midnight':'pearl';document.body.className=theme==='pearl'?'':theme;save('theme',theme);updateDiagnostics()});
render();
})();</script></body></html>
