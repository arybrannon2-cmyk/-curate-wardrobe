<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CURATE 0.1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--bg:#f5f5f2;--card:#fff;--ink:#262b28;--soft:#7e8881;--line:#e5e8e4;--accent:#40584a}
body.warm{--bg:#f6f0e8;--card:#fffcf8;--ink:#3b342d;--soft:#8f8273;--line:#eaddcf;--accent:#846b50}
body.midnight{color-scheme:dark;--bg:#171b19;--card:#252b28;--ink:#f4f5f1;--soft:#abb7ae;--line:#3b453e;--accent:#b2c7b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:30px 20px 14px;max-width:700px;margin:auto}header h1{font-family:Georgia,serif;letter-spacing:.24em;font-weight:400;font-size:26px;margin:0}header small{display:block;letter-spacing:.23em;font-size:9px;color:var(--soft);margin-top:7px}.icon{background:var(--card);border:1px solid var(--line);border-radius:50%;height:44px;width:44px;color:var(--ink)}
main{max-width:700px;margin:auto;padding:8px 18px 112px}h2{font-family:Georgia,serif;font-size:30px;font-weight:400;margin:17px 0 8px}h3{font-size:16px;margin:0 0 9px}.sub{color:var(--soft);font-size:13px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 10px 40px #00000006}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--card);color:var(--ink)}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.pill{border:1px solid var(--line);border-radius:100px;padding:9px 12px;background:transparent;color:var(--ink)}.pill.active{background:var(--accent);color:var(--bg)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 4px calc(12px + env(safe-area-inset-bottom));z-index:3}nav button{background:none;border:0;color:var(--soft);font-size:11px;min-width:68px;padding:5px 0}nav button.active{color:var(--ink);font-weight:700}nav span{display:block;font-size:22px;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:left;color:var(--ink)}.item .art{height:125px}.art{display:flex;align-items:center;justify-content:center;font-size:72px;background:var(--bg);border-radius:16px;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain}.item b{display:block;font-size:13px;margin:8px 4px 2px}.item small{color:var(--soft);margin-left:4px}.slot{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin:12px 0}.slot button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;height:43px}.slot .piece{background:var(--bg);border-radius:18px;padding:8px;text-align:center;touch-action:pan-y}.slot .art{height:105px;font-size:64px}.slot strong{display:block;font-size:13px;margin-top:6px}.flat{display:flex;gap:8px}.flat .art{flex:1;height:130px;font-size:50px}.muted{opacity:.65}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}.banner{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:16px}.empty{text-align:center;padding:25px;color:var(--soft)}input[type=file]{max-width:100%}
</style></head><body><header><div><h1>CURATE</h1><small>YOUR WARDROBE, REFINED</small></div><button class="icon" id="themeButton" aria-label="Change theme">◐</button></header><main id="main"></main><nav id="nav"></nav><script>
(function(){
const base=[['t1','Black Corduroy Pullover','tops','🧥'],['t2','White Essential Tee','tops','👕'],['t3','Gray Knit Sweater','tops','🧶'],['b1','Medium Wash Jeans','bottoms','👖'],['b2','Black Chinos','bottoms','👖'],['b3','Gray Joggers','bottoms','👖'],['s1','White Sneakers','shoes','👟'],['s2','Black Sneakers','shoes','👟'],['s3','Brown Boots','shoes','🥾']];
const load=(k,d)=>{try{let v=JSON.parse(localStorage.getItem('curate01_'+k));return v===null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('curate01_'+k,JSON.stringify(v))}catch(e){}};
let items=load('items',base),selected=load('selected',{tops:'t1',bottoms:'b1',shoes:'s1'}),looks=load('looks',[]),worn=load('worn',[]),theme=load('theme','pearl'),tab='Today',flat=false,filter='all',query='';
document.body.className=theme==='pearl'?'':theme;
const $=id=>document.getElementById(id),one=id=>items.find(i=>i[0]===id)||items[0],esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function img(item){return item[4]?'<img src="'+esc(item[4])+'" alt="'+esc(item[1])+'">':esc(item[3])}
function art(item){return '<div class="art">'+img(item)+'</div>'}
function outfit(o){return '<div class="flat">'+['tops','bottoms','shoes'].map(c=>art(one(o[c]))).join('')+'</div>'}
function cycle(cat,n){const arr=items.filter(x=>x[2]===cat);let ix=arr.findIndex(x=>x[0]===selected[cat]);if(arr.length){selected[cat]=arr[(ix+n+arr.length)%arr.length][0];save('selected',selected);render()}}
function shuffle(){['tops','bottoms','shoes'].forEach(c=>{let arr=items.filter(x=>x[2]===c);if(arr.length)selected[c]=arr[Math.floor(Math.random()*arr.length)][0]});save('selected',selected);render()}
function saveLook(){if(!looks.some(l=>l.tops===selected.tops&&l.bottoms===selected.bottoms&&l.shoes===selected.shoes)){looks.unshift({...selected,id:Date.now()});save('looks',looks);alert('Saved to My Looks ♡')}else alert('Already saved ♡');render()}
function markWorn(){worn.unshift({date:new Date().toLocaleDateString(),...selected});save('worn',worn);alert('Outfit recorded for today');render()}
function today(){return '<h2>Good morning.</h2><p class="sub">A considered wardrobe, without the effort. Sample outfits · Weather and AI arrive later.</p><section class="card"><div class="row"><h3>Today’s Look</h3><span class="sub">01 / CURATE</span></div>'+outfit(selected)+'<p class="sub">'+['tops','bottoms','shoes'].map(c=>esc(one(selected[c])[1])).join(' · ')+'</p><div class="buttons"><button class="btn primary" data-act="wear">Wore This Today</button><button class="btn" data-act="shuffle">Shuffle ↻</button><button class="btn" data-tab="Studio">Customize</button></div></section><section class="card"><h3>Make getting dressed easy.</h3><p class="sub">Build an outfit in Studio, then save it to My Looks. Your selections stay on this browser.</p></section>'}
function wardrobe(){let list=items.filter(i=>(filter==='all'||i[2]===filter)&&i[1].toLowerCase().includes(query.toLowerCase()));return '<h2>Wardrobe</h2><p class="sub">'+items.length+' pieces in your closet</p><input class="search" id="search" value="'+esc(query)+'" placeholder="Search your wardrobe…"><div class="buttons">'+['all','tops','bottoms','shoes'].map(c=>'<button class="pill '+(c===filter?'active':'')+'" data-filter="'+c+'">'+c[0].toUpperCase()+c.slice(1)+'</button>').join('')+'</div><section class="card"><h3>Quick Add</h3><p class="sub">Add a clothing photo. It stays in this browser only.</p><input id="photo" type="file" accept="image/*"><div class="buttons"><input id="garmentName" class="search" style="flex:1;min-width:130px" placeholder="Item name"><select id="garmentCat" class="btn"><option value="tops">Tops</option><option value="bottoms">Bottoms</option><option value="shoes">Shoes</option></select><button class="btn primary" data-act="add">Add</button></div></section><div class="grid">'+list.map(i=>'<div class="item">'+art(i)+'<b>'+esc(i[1])+'</b><small>'+esc(i[2])+'</small></div>').join('')+'</div>'}
function studio(){return '<h2>Smart Studio</h2><p class="sub">Swipe any garment or tap arrows to change it. Your last outfit is remembered.</p><div class="buttons"><button class="pill '+(!flat?'active':'')+'" data-view="interactive">Interactive</button><button class="pill '+(flat?'active':'')+'" data-view="flat">Flat Lay</button></div><section class="card">'+(flat?outfit(selected):['tops','bottoms','shoes'].map(c=>'<div class="slot"><button data-cycle="'+c+'" data-n="-1" aria-label="Previous '+c+'">‹</button><div class="piece" data-swipe="'+c+'">'+art(one(selected[c]))+'<strong>'+esc(one(selected[c])[1])+'</strong><span class="sub">'+c+'</span></div><button data-cycle="'+c+'" data-n="1" aria-label="Next '+c+'">›</button></div>').join(''))+'<div class="buttons"><button class="btn primary" data-act="save">♡ Save Look</button><button class="btn" data-act="shuffle">Surprise Me ↻</button></div></section><p class="sub">This first version uses demo pieces and simple matching. No image generation or AI required.</p>'}
function myLooks(){return '<h2>My Looks</h2><p class="sub">Your saved combinations and outfit history.</p>'+(looks.length?looks.map((l,i)=>'<section class="card"><div class="row"><h3>Look '+(looks.length-i)+'</h3><span class="sub">Saved</span></div>'+outfit(l)+'<p class="sub">'+['tops','bottoms','shoes'].map(c=>esc(one(l[c])[1])).join(' · ')+'</p><div class="buttons"><button class="btn primary" data-open="'+i+'">Edit in Studio</button><button class="btn" data-remove="'+i+'">Remove</button></div></section>').join(''):'<section class="card empty">No looks saved yet. Try saving one from Studio.</section>')+'<section class="card"><h3>Wear history</h3><p class="sub">'+worn.length+' outfit entries logged</p>'+worn.slice(0,5).map(l=>'<p class="sub">'+esc(l.date)+' · '+esc(one(l.tops)[1])+'</p>').join('')+'</section>'}
function render(){const pages={Today:today,Wardrobe:wardrobe,Studio:studio,'My Looks':myLooks};$('main').innerHTML=pages[tab]();$('nav').innerHTML=['Today','Wardrobe','Studio','My Looks'].map((t,i)=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'"><span>'+['⌂','▦','✧','♡'][i]+'</span>'+t+'</button>').join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){tab=d.tab;render()}else if(d.cycle)cycle(d.cycle,Number(d.n));else if(d.filter){filter=d.filter;render()}else if(d.view){flat=d.view==='flat';render()}else if(d.open!==undefined){selected={tops:looks[+d.open].tops,bottoms:looks[+d.open].bottoms,shoes:looks[+d.open].shoes};save('selected',selected);tab='Studio';render()}else if(d.remove!==undefined){looks.splice(+d.remove,1);save('looks',looks);render()}else if(d.act==='shuffle')shuffle();else if(d.act==='save')saveLook();else if(d.act==='wear')markWorn();else if(d.act==='add'){let f=$('photo').files[0],name=$('garmentName').value.trim(),cat=$('garmentCat').value;if(!name){alert('Enter a clothing name');return}if(!f){alert('Choose a photo');return}if(f.size>1500000){alert('Please use a photo smaller than 1.5 MB for this demo');return}let rd=new FileReader();rd.onload=()=>{items.push(['u'+Date.now(),name,cat,'👕',rd.result]);save('items',items);render()};rd.readAsDataURL(f)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let s=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(s,s)}});
let startX=null;document.addEventListener('touchstart',e=>{let el=e.target.closest('[data-swipe]');if(el)startX={x:e.touches[0].clientX,c:el.dataset.swipe}},{passive:true});document.addEventListener('touchend',e=>{if(!startX)return;let diff=e.changedTouches[0].clientX-startX.x;if(Math.abs(diff)>35)cycle(startX.c,diff<0?1:-1);startX=null},{passive:true});
$('themeButton').addEventListener('click',()=>{theme=theme==='pearl'?'warm':theme==='warm'?'midnight':'pearl';document.body.className=theme==='pearl'?'':theme;save('theme',theme)});
render();
})();</script></body></html>
