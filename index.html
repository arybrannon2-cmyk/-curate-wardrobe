*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;padding:30px 20px 14px;max-width:700px;margin:auto}header h1{font-family:Georgia,serif;letter-spacing:.24em;font-weight:400;font-size:26px;margin:0}header small{display:block;letter-spacing:.23em;font-size:9px;color:var(--soft);margin-top:7px}.icon{background:var(--card);border:1px solid var(--line);border-radius:50%;height:44px;width:44px;color:var(--ink)}
main{max-width:700px;margin:auto;padding:8px 18px 112px}h2{font-family:Georgia,serif;font-size:30px;font-weight:400;margin:17px 0 8px}h3{font-size:16px;margin:0 0 9px}.sub{color:var(--soft);font-size:13px;line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 10px 40px #00000006}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);border-radius:14px;padding:11px 14px;background:var(--card);color:var(--ink)}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.pill{border:1px solid var(--line);border-radius:100px;padding:9px 12px;background:transparent;color:var(--ink)}.pill.active{background:var(--accent);color:var(--bg)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 4px calc(12px + env(safe-area-inset-bottom));z-index:3}nav button{background:none;border:0;color:var(--soft);font-size:11px;min-width:68px;padding:5px 0}nav button.active{color:var(--ink);font-weight:700}nav span{display:block;font-size:22px;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:left;color:var(--ink)}.item .art{height:125px}.art{display:flex;align-items:center;justify-content:center;font-size:72px;background:var(--bg);border-radius:16px;overflow:hidden}.art img{width:100%;height:100%;object-fit:contain}.item b{display:block;font-size:13px;margin:8px 4px 2px}.item small{color:var(--soft);margin-left:4px}.slot{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin:12px 0}.slot button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;height:43px}.slot .piece{background:var(--bg);border-radius:18px;padding:8px;text-align:center;touch-action:pan-y}.slot .art{height:105px;font-size:64px}.slot strong{display:block;font-size:13px;margin-top:6px}.flat{display:flex;gap:8px}.flat .art{flex:1;height:130px;font-size:50px}.muted{opacity:.65}.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}.banner{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:16px}.empty{text-align:center;padding:25px;color:var(--soft)}input[type=file]{max-width:100%}

/* CURATE 0.2 visual refinement */
:root{--radius:26px;--shadow:0 12px 38px rgba(20,32,23,.055)}
body{background:var(--bg);-webkit-font-smoothing:antialiased}
header{padding-top:23px;padding-bottom:20px}
header h1{font-size:29px;letter-spacing:.27em}
header small{letter-spacing:.24em}
h2{font-size:36px;letter-spacing:-.035em}
h3{font-weight:600;letter-spacing:-.018em}
.card{border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.btn,.pill,.icon{transition:background .18s ease,transform .18s ease,border-color .18s ease}
.btn:active,.pill:active,.icon:active{transform:scale(.965)}
.art{background:linear-gradient(148deg,var(--bg),var(--card));position:relative}
.item .art{height:160px}
.item{border-radius:22px;padding:9px;overflow:hidden;box-shadow:var(--shadow)}
.item b{font-weight:600;font-size:13px}
.item small{text-transform:capitalize}
.slot{grid-template-columns:42px minmax(0,1fr) 42px;margin:13px 0}
.slot .piece{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:10px}
.slot .art{height:160px;background:var(--bg)}
.slot strong{font-size:14px;margin-top:8px}
.slot button{border-radius:50%;font-size:25px}
.flat .art{height:175px}
.art svg{height:95%;width:95%;filter:drop-shadow(0 9px 9px rgba(0,0,0,.13))}
.studio-intro{border-radius:24px;background:var(--card);border:1px solid var(--line);padding:17px;margin:16px 0 13px}
.studio-eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);font-weight:700}
.studio-intro p{font-family:Georgia,serif;font-size:22px;margin:9px 0 4px;line-height:1.23}
.studio-toggle{display:flex;gap:5px;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.studio-toggle .pill{flex:1;border:0;border-radius:12px}
nav{backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
@media(max-width:400px){.slot .art{height:135px}.flat .art{height:125px}.item .art{height:130px}}

/* CURATE compact Studio: mobile-first three-piece overview */
.studio-intro{padding:12px 15px;margin:9px 0}
.studio-intro p{font-size:19px;margin:5px 0}
.studio-toggle{margin:9px 0}
.studio-compact .slot{grid-template-columns:34px minmax(0,1fr) 34px;gap:8px;margin:6px 0}
.studio-compact .slot button{height:38px;width:34px;border-radius:12px;font-size:21px}
.studio-compact .slot .piece{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:1fr 1fr;align-items:center;text-align:left;column-gap:10px;padding:7px 10px;min-height:99px}
.studio-compact .slot .art{grid-row:1 / 3;height:86px;width:96px}
.studio-compact .slot strong{margin:0;align-self:end;font-size:13px;line-height:1.2}
.studio-compact .slot .sub{align-self:start;text-transform:capitalize;font-size:11px;margin-top:4px}
.studio-compact .card{padding:12px}
.studio-compact .buttons{margin-top:10px}
.studio-compact .flat .art{height:145px}
@media(max-width:380px){.studio-compact .slot .piece{grid-template-columns:78px minmax(0,1fr);column-gap:7px}.studio-compact .slot .art{width:78px;height:80px}.studio-compact .slot strong{font-size:12px}}

/* CURATE 0.4 — Studio premium visual polish, presentation only */
.studio-compact{--studio-line:color-mix(in srgb,var(--line) 82%,transparent);animation:studio-enter .28s ease-out both}
.studio-compact h2{font-family:Georgia,serif;font-size:clamp(30px,7vw,38px);font-weight:400;line-height:1.08;letter-spacing:-.042em;margin:14px 2px 14px}
.studio-compact .studio-intro{padding:16px 18px;border-radius:22px;border-color:var(--studio-line);box-shadow:0 8px 28px rgba(18,25,21,.035);margin:0 0 12px}
.studio-compact .studio-eyebrow{font-size:10px;letter-spacing:.19em;line-height:1.45}
.studio-compact .studio-intro p{font-family:Georgia,serif;font-weight:400;font-size:21px;letter-spacing:-.025em;line-height:1.2;margin:7px 0 7px}
.studio-compact .studio-intro .sub{line-height:1.45;display:block;font-size:12px}
.studio-compact .studio-toggle{padding:5px;gap:4px;border:1px solid var(--studio-line);border-radius:17px;margin:0 0 12px;box-shadow:0 3px 15px rgba(0,0,0,.018)}
.studio-compact .studio-toggle .pill{font-size:13px;font-weight:600;min-height:38px;letter-spacing:.005em;border-radius:12px;transition:background-color .22s ease,color .22s ease,box-shadow .22s ease}
.studio-compact .studio-toggle .pill.active{box-shadow:0 4px 10px rgba(10,20,15,.08)}
.studio-compact .card{padding:11px;border-radius:26px;border-color:var(--studio-line);box-shadow:0 15px 42px rgba(18,25,21,.045)}
.studio-compact .slot{grid-template-columns:35px minmax(0,1fr) 35px;gap:8px;margin:7px 0}
.studio-compact .slot .piece{min-height:108px;grid-template-columns:102px minmax(0,1fr);padding:9px 12px;column-gap:13px;grid-template-rows:1fr 1fr;border-radius:19px;border:1px solid var(--studio-line);box-shadow:0 5px 13px rgba(12,23,17,.025);transition:border-color .2s ease,box-shadow .2s ease,transform .22s ease;background:var(--card)}
.studio-compact .slot .piece:active{transform:scale(.987)}
.studio-compact .slot .art{width:102px;height:88px;border-radius:13px;background:var(--bg)}
.studio-compact .slot .art svg{filter:drop-shadow(0 6px 5px rgba(0,0,0,.10))}
.studio-compact .slot strong{font-size:13px;font-weight:650;line-height:1.27;letter-spacing:-.015em;overflow-wrap:anywhere}
.studio-compact .slot .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-top:5px}
.studio-compact .slot button{height:38px;width:35px;border-radius:13px;font-size:21px;border-color:var(--studio-line);transition:background-color .18s ease,transform .18s ease}
.studio-compact .slot button:active{transform:scale(.91);background:var(--bg)}
.studio-compact .buttons{gap:8px;margin-top:14px}
.studio-compact .buttons .btn{min-height:43px;flex:1;white-space:nowrap;font-size:13px;font-weight:600;border-radius:14px;padding:11px 8px;transition:transform .18s ease,box-shadow .18s ease}
.studio-compact .buttons .btn.primary{box-shadow:0 5px 14px rgba(25,40,29,.12)}
.studio-compact .flat{gap:9px}
.studio-compact .flat .art{height:155px;border-radius:17px}
.studio-compact > .sub{font-size:11px;line-height:1.5;margin:13px 8px 0;text-align:center}
@keyframes studio-enter{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:390px){.studio-compact .slot .piece{grid-template-columns:82px minmax(0,1fr);min-height:100px;column-gap:9px;padding:7px 8px}.studio-compact .slot .art{width:82px;height:82px}.studio-compact .slot strong{font-size:12px}.studio-compact .slot{gap:5px}.studio-compact .studio-intro p{font-size:19px}}
@media(prefers-reduced-motion:reduce){.studio-compact,.studio-compact *, .studio-compact *::before,.studio-compact *::after{animation:none!important;transition:none!important}}

/* CURATE 0.5: editorial flat lay, scoped exclusively to Studio */
.studio-compact .editorial-board{position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--line);border-radius:23px;padding:18px 15px 17px;background:var(--bg);animation:board-reveal .38s cubic-bezier(.2,.7,.2,1) both}
.studio-compact .editorial-board:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 15% 3%,rgba(255,255,255,.23),transparent 57%)}
.studio-compact .editorial-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:0 2px 13px;border-bottom:1px solid var(--line);position:relative;z-index:1}
.studio-compact .editorial-kicker{font-size:9px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:var(--soft)}
.studio-compact .editorial-title{font-family:Georgia,serif;letter-spacing:-.025em;font-weight:400;font-size:22px;line-height:1.2;margin:5px 0 0}
.studio-compact .editorial-number{color:var(--soft);font-family:Georgia,serif;font-size:13px}
.studio-compact .editorial-grid{display:grid;grid-template-columns:1.12fr .88fr;grid-template-rows:158px 132px;gap:9px;margin-top:15px;position:relative;z-index:1}
.studio-compact .editorial-piece{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;min-width:0}
.studio-compact .editorial-piece:first-child{grid-row:1/3}
.studio-compact .editorial-piece .art{background:transparent;width:100%;height:calc(100% - 23px);border-radius:12px}
.studio-compact .editorial-piece .art img,.studio-compact .editorial-piece .art svg{width:100%;height:100%;object-fit:contain}
.studio-compact .editorial-piece .art svg{filter:drop-shadow(0 8px 7px rgba(0,0,0,.11))}
.studio-compact .editorial-piece:first-child .art{height:calc(100% - 29px)}
.studio-compact .editorial-caption{display:block;text-align:center;font-size:10px;line-height:1.2;font-weight:600;letter-spacing:.01em;max-width:100%;padding:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.studio-compact .editorial-index{position:absolute;top:10px;left:11px;font-size:9px;letter-spacing:.12em;color:var(--soft);z-index:2}
.studio-compact .editorial-foot{border-top:1px solid var(--line);margin-top:15px;padding-top:10px;display:flex;justify-content:space-between;gap:8px;color:var(--soft);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
@keyframes board-reveal{from{opacity:.65;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(hover:hover){.studio-compact .editorial-piece:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(15,26,18,.06)}}
@media(max-width:380px){.studio-compact .editorial-grid{grid-template-rows:140px 118px;gap:7px}.studio-compact .editorial-board{padding:14px 11px}.studio-compact .editorial-title{font-size:20px}}
@media(prefers-reduced-motion:reduce){.studio-compact .editorial-board{animation:none}.studio-compact .editorial-piece{transition:none}}

/* CURATE 0.6: editorial micro-details, Studio flat-lay only */
.studio-compact .editorial-head{align-items:start}
.studio-compact .editorial-star{display:inline-block;margin:0 4px;color:var(--accent);font-size:10px;letter-spacing:0}
.studio-compact .editorial-issue{color:var(--soft);font-size:8px;font-weight:600;letter-spacing:.13em;margin-top:8px}
.studio-compact .editorial-number{font-family:inherit;font-weight:600;font-size:9px;letter-spacing:.1em;white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:6px 8px}
.studio-compact .editorial-note{display:flex;align-items:start;gap:11px;padding:13px 1px 12px;border-top:1px solid var(--line);margin-top:14px}
.studio-compact .editorial-note-mark{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:12px}
.studio-compact .editorial-note-title{color:var(--ink);display:block;text-transform:uppercase;letter-spacing:.15em;font-weight:650;font-size:9px;margin:1px 0 4px}
.studio-compact .editorial-note p{color:var(--soft);font-size:11px;line-height:1.5;margin:0}
.studio-compact .editorial-foot{margin-top:0;padding-top:10px;font-size:9px;letter-spacing:.075em}
/* Prevent browser-driven automatic SVG color changes in dark appearance. */
.art svg{color-scheme:only light;forced-color-adjust:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* SVGs shown as image resources, isolating palette from browser's inline SVG adjustments. */
.art img.garment-image{display:block;width:100%;height:100%;object-fit:contain;filter:none!important;mix-blend-mode:normal;opacity:1}
/* CURATE garment surface: stable neutral contrast across all appearance modes */
:root,body.warm,body.midnight{--garment-surface:#b8bcb9;--garment-edge:#989f9a}
.art{background:var(--garment-surface);border:1px solid var(--garment-edge)}
.slot .art,.studio-compact .slot .art,.studio-compact .editorial-piece .art{background:var(--garment-surface)}
.diag-image{background:var(--garment-surface)}
.art img.garment-image,.diag-image.garment-image{filter:none!important;mix-blend-mode:normal!important;opacity:1!important}

/* Real-wardrobe Studio interaction polish */
.studio-compact .slot .piece{cursor:grab;user-select:none;-webkit-user-select:none;transition:background-color .2s ease,box-shadow .2s ease}
.studio-compact .slot .piece:active{cursor:grabbing}
.studio-compact .slot .piece:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.studio-compact .slot button{font-size:24px;transition:transform .16s ease,background .16s ease}
.studio-compact .slot button:active{transform:scale(.92)}
.studio-compact .slot[data-changing="next"] .piece>*{animation:curate-slide-next .26s cubic-bezier(.2,.8,.2,1) both}
.studio-compact .slot[data-changing="prev"] .piece>*{animation:curate-slide-prev .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes curate-slide-next{from{opacity:.35;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes curate-slide-prev{from{opacity:.35;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.studio-position{display:block;font-size:11px;letter-spacing:.04em;color:var(--soft);margin-top:3px}
@media(prefers-reduced-motion:reduce){.studio-compact .slot[data-changing] .piece>*{animation:none}.studio-compact .slot button,.studio-compact .slot .piece{transition:none}}

/* Fast wardrobe selection in Studio */
.studio-pickers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0}
.studio-picker{min-width:0;display:block;font-size:11px;color:var(--soft)}
.studio-picker select{display:block;width:100%;min-width:0;margin-top:5px;padding:10px 7px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;text-overflow:ellipsis}
@media(max-width:380px){.studio-pickers{grid-template-columns:1fr}.studio-picker select{font-size:14px}}

/* Editorial full-outfit composition. Original garments remain uncropped. */
.full-look{margin:14px 0 16px;padding:15px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.full-look-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px}
.full-look-head h3{font-family:Georgia,serif;font-size:22px;font-weight:400;margin:0}
.full-look-head span{font-size:10px;color:var(--soft);text-transform:uppercase;letter-spacing:.1em}
.full-look-canvas{max-width:370px;margin:auto;display:grid;grid-template-rows:190px 190px 110px;gap:0;padding:13px 20px;background:var(--garment-surface);border:1px solid var(--garment-edge);border-radius:19px;overflow:hidden}
.full-look-layer{display:flex;justify-content:center;align-items:center;min-width:0;min-height:0;position:relative}
.full-look-layer img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:normal;filter:none}
.full-look-layer:after{content:attr(data-kind);position:absolute;left:0;bottom:4px;color:#35413c;background:#eef1eecc;border-radius:8px;padding:3px 6px;font-size:9px;letter-spacing:.09em;text-transform:uppercase}
.full-look-layer.shoes img{width:92%}
.full-look-caption{margin-top:10px;color:var(--soft);font-size:12px;line-height:1.45;text-align:center}
@media(max-width:400px){.full-look-canvas{grid-template-rows:150px 155px 92px;padding:10px 14px}}
@media(prefers-reduced-motion:no-preference){.full-look-layer img{animation:curate-preview-enter .22s ease-out both}@keyframes curate-preview-enter{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}}

/* Complete Look refinement: tailored spacing and clothing hierarchy */
.full-look-canvas{max-width:390px;grid-template-rows:minmax(0,170px) minmax(0,245px) minmax(0,112px);gap:0;padding:18px 19px 16px}
.full-look-layer{overflow:hidden}
.full-look-layer.tops{align-items:end;padding:0 12px 0}
.full-look-layer.bottoms{align-items:center;padding:0 29px}
.full-look-layer.shoes{align-items:start;padding:0 24px 0}
.full-look-layer img{width:100%;height:100%;object-fit:contain;object-position:center}
.full-look-layer.tops img{height:98%;object-position:center bottom}
.full-look-layer.bottoms img{height:99%;object-position:center}
.full-look-layer.shoes img{height:96%;width:88%;object-position:center top}
.full-look-layer:after{bottom:2px;left:2px}
@media(max-width:400px){
 .full-look-canvas{grid-template-rows:145px 212px 98px;padding:13px 10px 12px}
 .full-look-layer.tops{padding:0 8px}
 .full-look-layer.bottoms{padding:0 19px}
 .full-look-layer.shoes{padding:0 16px}
}

/* Tappable Complete Look regions; preserve the approved proportions */
button.full-look-layer{appearance:none;-webkit-appearance:none;border:0;background:transparent;margin:0;width:100%;min-width:0;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}
button.full-look-layer:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:12px}
button.full-look-layer:active img{opacity:.78}
@media(hover:hover){button.full-look-layer:hover{background:#ffffff18;border-radius:12px}}

/* Saved Looks editorial cards: reuse approved Complete Look composition */
.lookbook-card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:15px;margin:18px 0;box-shadow:0 10px 35px #00000008}
.lookbook-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:13px}
.lookbook-kicker,.lookbook-number{font-size:10px;letter-spacing:.14em;color:var(--soft)}
.lookbook-head h3{font-family:Georgia,serif;font-size:29px;font-weight:400;margin:5px 0 0}
.lookbook-canvas{max-width:390px;margin:0 auto}
.lookbook-details{display:grid;gap:0;margin-top:12px;border-top:1px solid var(--line)}

 const pal={t1:['#292a29','#51534f'],t2:['#f7f7f2','#d6d7d2'],t3:['#969b9f','#70767b'],b1:['#6080a8','#405f85'],b2:['#23272a','#444a4e'],b3:['#a4a9ac','#777f83'],s1:['#f4f4ef','#b8bdb9'],s2:['#24282b','#4a4f53'],s3:['#795842','#523a2b']};

 }else if(id[0]==='b'){

const importedUrls=new Map();
let importMessage='',importBusy=false;
const encoder=new TextDecoder();
function openImportDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('curate-private-images',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('images'))r.result.createObjectStore('images')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function imageGet(db,id){return new Promise((resolve,reject)=>{const t=db.transaction('images','readonly'),r=t.objectStore('images').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function imagesPut(db,entries){return new Promise((resolve,reject)=>{const t=db.transaction('images','readwrite');for(const e of entries)t.objectStore('images').put(e.blob,e.id);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function imagesDelete(db,ids){return new Promise(resolve=>{const t=db.transaction('images','readwrite');ids.forEach(id=>t.objectStore('images').delete(id));t.oncomplete=resolve;t.onerror=resolve;t.onabort=resolve})}
async function hydrateImported(){try{const db=await openImportDB();for(const item of items){if(item[4]==='idb:'+item[0]){const b=await imageGet(db,item[0]);if(b){const previous=importedUrls.get(item[0]);if(previous)URL.revokeObjectURL(previous);importedUrls.set(item[0],URL.createObjectURL(b))}}}db.close();render()}catch(e){console.warn('Local wardrobe images unavailable',e)}}
function zipEntries(buffer){
 const v=new DataView(buffer),u=new Uint8Array(buffer);let end=-1;
 for(let p=u.length-22;p>=Math.max(0,u.length-65557);p--)if(v.getUint32(p,true)===0x06054b50){end=p;break}
 if(end<0)throw Error('Invalid ZIP: directory not found.');
 const count=v.getUint16(end+10,true),offset=v.getUint32(end+16,true);if(count>200||offset>=u.length)throw Error('ZIP directory is invalid or too large.');
 let p=offset;const entries=new Map();
 for(let k=0;k<count;k++){
  if(p+46>u.length||v.getUint32(p,true)!==0x02014b50)throw Error('Invalid ZIP file entry.');
  const method=v.getUint16(p+10,true),size=v.getUint32(p+20,true),uncompressed=v.getUint32(p+24,true),n=v.getUint16(p+28,true),extra=v.getUint16(p+30,true),comment=v.getUint16(p+32,true),local=v.getUint32(p+42,true);
  if(size>12000000||uncompressed>12000000)throw Error('ZIP image exceeds 12 MB.');
  const name=encoder.decode(u.slice(p+46,p+46+n));p+=46+n+extra+comment;
  if(!name.endsWith('/')){if(entries.has(name))throw Error('Duplicate ZIP path: '+name);entries.set(name,{method,size,uncompressed,local})}
 }
 return async function(name){const e=entries.get(name);if(!e)throw Error('Missing file: '+name);const p=e.local;if(p+30>u.length||v.getUint32(p,true)!==0x04034b50)throw Error('Invalid ZIP entry: '+name);const start=p+30+v.getUint16(p+26,true)+v.getUint16(p+28,true);if(start+e.size>u.length)throw Error('Truncated ZIP image: '+name);const bytes=u.slice(start,start+e.size);
 let out;if(e.method===0)out=bytes;else if(e.method===8){if(typeof DecompressionStream==='undefined')throw Error('This browser cannot decompress ZIP files.');try{const ds=new DecompressionStream('deflate-raw');out=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer())}catch(err){throw Error('ZIP decompression unavailable in this browser: '+err.message)}}else throw Error('Unsupported ZIP compression method: '+e.method);

}
async function importPrivateZip(file,replacePhotos=false){
 if(importBusy)return;importBusy=true;importMessage='Validating ZIP…';render();let db;
 try{
  if(!file||file.size>35000000)throw Error('Choose a ZIP smaller than 35 MB.');
  const read=zipEntries(await file.arrayBuffer()),manifest=JSON.parse(encoder.decode(await read('wardrobe.json')));
  if(!Array.isArray(manifest.items)||!manifest.items.length||manifest.items.length>100)throw Error('wardrobe.json must contain 1–100 items.');
  if(!crypto?.subtle)throw Error('Secure browser context required to verify image checksums.');
  const existing=new Set(items.map(x=>x[0].toLowerCase())),seen=new Set(),prepared=[],errors=[];
  const cats={tops:'tops',bottoms:'bottoms',shoes:'shoes',layers:'tops',sweatshirts:'tops','sweatshirts & pullovers':'tops'};
  for(const row of manifest.items){
   const id=String(row.id||'').trim(),name=String(row.name||'').trim(),cat=cats[String(row.category||'').toLowerCase()],path=row.image_file;
   if(!/^[A-Za-z][A-Za-z0-9_-]{1,39}$/.test(id)){errors.push('Invalid ID: '+id);continue}
   if(seen.has(id.toLowerCase())){errors.push('Repeated ID inside ZIP: '+id);continue}seen.add(id.toLowerCase());
   if(!replacePhotos&&existing.has(id.toLowerCase())){errors.push('Already in CURATE: '+id);continue}if(replacePhotos){const previous=items.find(x=>x[0].toLowerCase()===id.toLowerCase());if(!previous){errors.push(id+': not yet in CURATE; import the original wardrobe ZIP first');continue}if(previous[1].trim().toLowerCase()!==name.toLowerCase()||previous[2]!==cat){errors.push(id+': name/category mismatch; no photo replaced');continue}}
   if(!name||name.length>120||!cat){errors.push(id+': invalid name or category');continue}
   if(typeof path!=='string'||!/^photos\/[A-Za-z0-9_.-]+\.(jpg|jpeg|png|webp)$/i.test(path)){errors.push(id+': invalid image path');continue}
   try{
    const bytes=await read(path);if(bytes.length>5000000)throw Error('image exceeds 5 MB');
    const jpeg=bytes[0]===255&&bytes[1]===216, png=bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71, webp=encoder.decode(bytes.slice(0,4))==='RIFF'&&encoder.decode(bytes.slice(8,12))==='WEBP';
    if(!jpeg&&!png&&!webp)throw Error('invalid image format');
    const hex=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
    if(row.image_sha256&&hex!==String(row.image_sha256).toLowerCase())throw Error('SHA-256 checksum mismatch');
    prepared.push({id,blob:new Blob([bytes],{type:jpeg?'image/jpeg':png?'image/png':'image/webp'}),row,cat,name})
   }catch(e){errors.push(id+': '+e.message)}
  }

  try{localStorage.setItem('curate01_items',JSON.stringify(updated))}catch(e){await imagesDelete(db,prepared.map(x=>x.id));throw Error('Could not save wardrobe list locally: '+e.message)}

  importMessage=replacePhotos?'Updated '+prepared.length+' garment photos privately. IDs, names, categories, and saved looks preserved.':'Imported '+prepared.length+' garments privately. Image checksums verified. No existing items replaced.';
 }catch(e){importMessage='Import failed: '+e.message}finally{if(db)db.close();importBusy=false;render()}
}

function studio(){return '<div class="studio-compact"><h2>Smart Studio</h2><div class="studio-intro"><div class="studio-eyebrow">Your personal styling canvas</div><p>Build something worth wearing.</p><span class="sub">Swipe garments or tap arrows. Switch views anytime.</span></div><div class="studio-toggle"><button class="pill '+(!flat?'active':'')+'" data-view="interactive">Interactive</button><button class="pill '+(flat?'active':'')+'" data-view="flat">Flat Lay</button></div><div class="studio-pickers">'+['tops','bottoms','shoes'].map(c=>'<label class="studio-picker">'+c.charAt(0).toUpperCase()+c.slice(1)+'<select data-pick="'+c+'" aria-label="Choose '+c+'">'+items.filter(x=>x[2]===c).map(x=>'<option value="'+esc(x[0])+'" '+(selected[c]===x[0]?'selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></label>').join('')+'</div>'+fullLookPreview(selected)+'<section class="card">'+(flat?studioFlat(selected):['tops','bottoms','shoes'].map(c=>'<div class="slot" '+(changingCategory===c?'data-changing="'+changeDirection+'"':'')+'><button data-cycle="'+c+'" data-n="-1" aria-label="Previous '+c+'">‹</button><div class="piece" data-swipe="'+c+'">'+art(one(selected[c]))+'<strong>'+esc(one(selected[c])[1])+'</strong><span class="sub">'+c+'</span></div><button data-cycle="'+c+'" data-n="1" aria-label="Next '+c+'">›</button></div>').join(''))+'<div class="buttons"><button class="btn primary" data-act="save">♡ Save Look</button><button class="btn" data-act="shuffle">Surprise Me ↻</button></div></section><p class="sub">Your imported Studio garment photos. Swipe left or right to explore your real closet.</p></div>'}
let looksFavoritesOnly=false,looksQuery='',looksSort='newest';
function lookbookCard(l,i){const valid=['tops','bottoms','shoes'].every(c=>items.some(x=>x[0]===l[c]&&x[2]===c));return '<article class="lookbook-card"><div class="lookbook-head"><div><span class="lookbook-kicker">CURATE / SAVED LOOKS</span><h3>'+esc(l.name||('Look '+String(looks.length-i).padStart(2,'0')))+'</h3></div><span class="lookbook-number">'+String(i+1).padStart(2,'0')+' / '+String(looks.length).padStart(2,'0')+'</span></div>'+(valid?'<div class="full-look-canvas lookbook-canvas">'+['tops','bottoms','shoes'].map(c=>'<div class="full-look-layer '+c+'" data-kind="'+c+'">'+img(one(l[c]))+'</div>').join('')+'</div>':'<div class="lookbook-missing">One or more garments are no longer in your wardrobe.</div>')+'<div class="lookbook-details">'+['tops','bottoms','shoes'].map(c=>'<div><span>'+c+'</span><strong>'+esc(items.find(x=>x[0]===l[c])?.[1]||'Unavailable')+'</strong></div>').join('')+'</div><div class="buttons"><button class="btn" data-rename="'+i+'">✎ Rename</button><button class="btn look-favorite '+(l.favorite?'is-favorite':'')+'" data-favorite="'+i+'" aria-pressed="'+(!!l.favorite)+'">'+(l.favorite?'♥ Favorited':'♡ Favorite')+'</button><button class="btn primary" data-open="'+i+'" '+(valid?'':'disabled')+'>Open in Studio</button><button class="btn" data-remove="'+i+'">Remove Look</button></div></article>'}
function myLooks(){const q=looksQuery.trim().toLocaleLowerCase();const matching=looks.map((l,i)=>({l,i})).filter(({l})=>(!looksFavoritesOnly||!!l.favorite)&&(!q||[l.name||'',...['tops','bottoms','shoes'].map(c=>items.find(x=>x[0]===l[c])?.[1]||'')].some(t=>t.toLocaleLowerCase().includes(q))));matching.sort((a,b)=>looksSort==='name'?(a.l.name||('Look '+(looks.length-a.i))).localeCompare(b.l.name||('Look '+(looks.length-b.i)),undefined,{sensitivity:'base',numeric:true}):looksSort==='oldest'?(Number(a.l.id)||0)-(Number(b.l.id)||0):(Number(b.l.id)||0)-(Number(a.l.id)||0));return '<h2>My Looks</h2><p class="sub">Your personal lookbook · '+looks.length+' saved '+(looks.length===1?'outfit':'outfits')+'</p><input type="search" class="search" id="looksSearch" aria-label="Search saved looks" placeholder="Search outfit names or clothing…" value="'+esc(looksQuery)+'"><label class="looks-sort">Sort by <select id="looksSort" aria-label="Sort saved looks"><option value="newest" '+(looksSort==='newest'?'selected':'')+'>Newest first</option><option value="oldest" '+(looksSort==='oldest'?'selected':'')+'>Oldest first</option><option value="name" '+(looksSort==='name'?'selected':'')+'>Name A–Z</option></select></label><div class="buttons looks-filters"><button class="pill '+(!looksFavoritesOnly?'active':'')+'" data-looks-filter="all">All Looks</button><button class="pill '+(looksFavoritesOnly?'active':'')+'" data-looks-filter="favorites">♥ Favorites ('+looks.filter(l=>l.favorite).length+')</button></div>'+(matching.length?matching.map(({l,i})=>lookbookCard(l,i)).join(''):'<section class="card empty">'+(looks.length?'No saved looks match your search and filters.':'No looks saved yet. Create a combination in Studio and tap ♡ Save Look.')+'</section>')+'<section class="card"><h3>Wear history</h3><p class="sub">'+worn.length+' outfit entries logged</p>'+worn.slice(0,5).map(l=>'<p class="sub">'+esc(l.date)+' · '+esc(items.find(x=>x[0]===l.tops)?.[1]||'Unavailable')+'</p>').join('')+'</section>'}
function render(){const ready=['tops','bottoms','shoes'].every(c=>items.some(x=>x[0]===selected[c]&&x[2]===c));const pages={Today:today,Wardrobe:wardrobe,Studio:studio,'My Looks':myLooks};$('main').innerHTML=(!ready&&(tab==='Today'||tab==='Studio'))?'<h2>Your real wardrobe</h2><p class="sub">Add a top, bottom, and pair of shoes in Wardrobe to build outfits.</p><button class="btn primary" data-tab="Wardrobe">Open Wardrobe</button>':pages[tab]();$('nav').innerHTML=['Today','Wardrobe','Studio','My Looks'].map((t,i)=>'<button class="'+(t===tab?'active':'')+'" data-tab="'+t+'"><span>'+['⌂','▦','✧','♡'][i]+'</span>'+t+'</button>').join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab){tab=d.tab;changingCategory='';render()}else if(d.cycle)cycle(d.cycle,Number(d.n));else if(d.filter){filter=d.filter;render()}else if(d.view){flat=d.view==='flat';render()}else if(d.looksFilter){looksFavoritesOnly=d.looksFilter==='favorites';render()}else if(d.rename!==undefined){const i=Number(d.rename),look=looks[i];if(look){const entered=prompt('Name this outfit (up to 60 characters):',look.name||'');if(entered!==null){const name=entered.trim();if(name.length>60){alert('Please use 60 characters or fewer.')}else{if(name)look.name=name;else delete look.name;save('looks',looks);render()}}}}else if(d.favorite!==undefined){const i=Number(d.favorite);if(looks[i]){looks[i].favorite=!looks[i].favorite;save('looks',looks);render()}}else if(d.open!==undefined){selected={tops:looks[+d.open].tops,bottoms:looks[+d.open].bottoms,shoes:looks[+d.open].shoes};save('selected',selected);tab='Studio';render()}else if(d.remove!==undefined){looks.splice(+d.remove,1);save('looks',looks);render()}else if(d.act==='shuffle')shuffle();else if(d.act==='save')saveLook();else if(d.act==='wear')markWorn();else if(d.act==='zip-import'){const f=$('privateZip')?.files[0];if(!f){importMessage='Choose a ZIP file first.';render();return}importPrivateZip(f,false)}else if(d.act==='zip-replace'){const f=$('privateZip')?.files[0];if(!f){importMessage='Choose the Studio ZIP first.';render();return}importPrivateZip(f,true)}else if(d.act==='add'){let f=$('photo').files[0],name=$('garmentName').value.trim(),cat=$('garmentCat').value;if(!name){alert('Enter a clothing name');return}if(!f){alert('Choose a photo');return}if(f.size>1500000){alert('Please use a photo smaller than 1.5 MB for this demo');return}let rd=new FileReader();rd.onload=()=>{items.push(['u'+Date.now(),name,cat,'👕',rd.result]);save('items',items);render()};rd.readAsDataURL(f)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='looksSort'){looksSort=el.value;render();return}if(!el.matches('[data-pick]'))return;const c=el.dataset.pick;if(!['tops','bottoms','shoes'].includes(c)||!items.some(x=>x[0]===el.value&&x[2]===c))return;selected[c]=el.value;changingCategory=c;changeDirection='next';save('selected',selected);render()});
document.addEventListener('input',e=>{if(e.target.id==='looksSearch'){looksQuery=e.target.value;const pos=e.target.selectionStart;render();const input=$('looksSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}return}if(e.target.id==='search'){query=e.target.value;let s=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(s,s)}});
let startX=null;document.addEventListener('touchstart',e=>{let el=e.target.closest('[data-swipe]');if(el)startX={x:e.touches[0].clientX,c:el.dataset.swipe}},{passive:true});document.addEventListener('touchend',e=>{if(!startX)return;let diff=e.changedTouches[0].clientX-startX.x;if(Math.abs(diff)>35)cycle(startX.c,diff<0?1:-1);startX=null},{passive:true});
$('themeButton').addEventListener('click',()=>{theme=theme==='pearl'?'warm':theme==='warm'?'midnight':'pearl';document.body.className=theme==='pearl'?'':theme;save('theme',theme)});
render();hydrateImported();
})();</script></body></html>
